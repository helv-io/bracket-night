# Build multi-arch images and publish to Docker Hub (helvio/*).
#
# Required:
#   Variable DOCKERHUB_USERNAME (e.g. helvio)
#   Secret DOCKERHUB_TOKEN
#
# Image: docker.io/<DOCKERHUB_USERNAME>/bracket-night
# Sole user: always tag :latest on non-PR pushes.

name: Docker

on:
  push:
    branches: [main, master, restore/thick-gold-coin]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  IMAGE_NAME: bracket-night

jobs:
  docker:
    name: Build & push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve Docker Hub username
        id: hub
        run: |
          USERNAME="${{ vars.DOCKERHUB_USERNAME }}"
          if [ -z "$USERNAME" ]; then
            USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
          fi
          if [ -z "$USERNAME" ]; then
            echo "DOCKERHUB_USERNAME is not set (repo Variable or Secret)." >&2
            exit 1
          fi
          echo "username=${USERNAME}" >> "$GITHUB_OUTPUT"
          echo "image=docker.io/${USERNAME}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Docker meta (tags / labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.hub.outputs.image }}
          tags: |
            # always latest on any push/dispatch (sole user)
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=test,enable=${{ github.ref == 'refs/heads/restore/thick-gold-coin' }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ steps.hub.outputs.username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
